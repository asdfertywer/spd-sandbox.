name: Build Sandbox APK  
  
on:  
  workflow_dispatch:  
  push:  
  
permissions:  
  contents: write  
  
jobs:  
  build:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout this repo (contains sandbox-mode-2.patch)  
        uses: actions/checkout@v4  
  
      - name: Get official Shattered Pixel Dungeon and apply Sandbox patch  
        run: |  
          git clone https://github.com/00-Evan/shattered-pixel-dungeon.git game  
          cd game  
          git checkout 57a4e06a4caf162446d1c28caa7983f0493fecf0  
          git apply --whitespace=nowarn ../sandbox-mode-2.patch  
  
      - uses: actions/setup-java@v4  
        with:  
          distribution: temurin  
          java-version: 21 
              - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Fix debug keystore
        run: |
          mkdir -p "$HOME/.config/.android"
          chmod -R u+rwX "$HOME/.config"
          mkdir -p "$HOME/.android"
          chmod -R u+rwX "$HOME/.android"
          mkdir -p "$HOME/.config/.android"
          chmod -R u+rwX "$HOME/.config"
          mkdir -p "$HOME/.android"
          chmod -R u+rwX "$HOME/.android"
          
      - name: Build debug APK  
        working-directory: game  
        run: |  
          chmod +x gradlew  
          ./gradlew :android:assembleDebug --no-daemon --stacktrace  
  
      - name: Keep APK as artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: ShatteredPD-Sandbox-apk  
          path: game/android/build/outputs/apk/debug/*.apk  
  
      - name: Publish APK in Releases  
        env:  
          GH_TOKEN: ${{ github.token }}  
        run: |  
          cp game/android/build/outputs/apk/debug/*.apk ShatteredPD-Sandbox.apk  
          gh release create "sandbox-${{ github.run_number }}" ShatteredPD-Sandbox.apk --title "Sandbox APK #${{ github.run_number }}" --notes "Debug APK with Sandbox Mode"  
